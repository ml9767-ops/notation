name: SBOMit Workflow Build Result Comparison

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: make build

      - name: Upload Baseline Results
        uses: actions/upload-artifact@v4
        with:
          name: baseline-results
          path: bin/notation
          if-no-files-found: error

  sbomit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build under SBOMit
        uses: Uk-jake/sbomit-pipeline-runner@main
        with:
          build-command: make build
          sbom-format: spdx23
          use-syft: true

      - name: Upload SBOMit Results
        uses: actions/upload-artifact@v4
        with:
          name: sbomit-results
          path: bin/notation
          if-no-files-found: error

  compare:
    needs: [baseline, sbomit]
    runs-on: ubuntu-22.04

    steps:
      - name: Download Baseline Results
        uses: actions/download-artifact@v4
        with:
          name: baseline-results
          path: baseline/

      - name: Download SBOMit Results
        uses: actions/download-artifact@v4
        with:
          name: sbomit-results
          path: sbomit/

      - name: Compare Build Results
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Build Output SHA256 ==="
          sha256sum baseline/notation sbomit/notation

          echo "=== Comparing Binary Contents ==="
          if cmp -s baseline/notation sbomit/notation; then
            echo "Binary contents: IDENTICAL"
          else
            echo "Binary contents: DIFFERENT"
            exit 1
          fi
