name: Build Time Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - name: Build
        run: make build
